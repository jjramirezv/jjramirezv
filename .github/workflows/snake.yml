name: Generate Snake

on:
  schedule:
    - cron: "0 5 * * *" # todos los días (UTC)
  workflow_dispatch: # permite ejecutarlo a mano desde la pestaña Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar serpiente a partir de las contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/teal-snake-light.svg?color_snake=#7c3aed&color_dots=#ebedf0,#99f6e4,#2dd4bf,#14b8a6,#0f766e
            dist/teal-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#243044,#0f766e,#14b8a6,#2dd4bf,#99f6e4

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
